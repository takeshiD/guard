[package]
name = "guard"
version = "0.1.0"
edition = "2021"
authors = ["takeshid<goriponikeike55@gmail.com>"]
description = "file guard tool for conding agent"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "3"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# File watching
notify = "8.2"
notify-debouncer-full = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & Time
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[[bin]]
name = "guard"
path = "src/main.rs"
