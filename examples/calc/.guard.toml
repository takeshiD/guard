version = "1.0"

# ========================================
# 設定ファイル - 完全保護
# ========================================

[[guards]]
path = "src/config.rs"
reason = "重要な定数（精度、最大値、税率など）を含むため変更禁止"
ranges = [
  { start = 1, end = 999 },  # ファイル全体
]

# ========================================
# メインファイル - 部分保護
# ========================================

[[guards]]
path = "src/main.rs"
reason = "エラーハンドリングとプログラムの基本構造は安定性に関わる"
ranges = [
  { start = 10, end = 25 },  # エラーハンドリング部分
]

# ========================================
# 全体設定
# ========================================

[settings]
auto_rollback = true
log_file = ".guard/guard.log"
strict_mode = false
